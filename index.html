function label(c){const sx=c.s==='F'?'여':c.s==='M'?'남':'성별 미상';const ag=c.a?(c.a.includes('개월')?c.a:c.a+'세'):'나이 미상';return `${sx} · ${ag}`}
function render(){const c=deck[i];$('cnt').textContent=(i+1)+' / '+deck.length;
$('card').innerHTML=back?`<div class="cc">${c.cc}</div><div class="meta">${label(c)}</div><div class="say">“${c.t}”</div><div class="hint">탭하면 앞면으로</div>`
:`${av2(c.s,c.a,c.t)}<div class="meta">${label(c)}</div><div class="say">“${c.t}”</div><div class="hint">어떤 CC 모듈일까요? 탭해서 확인</div>`;

function go(d){i=(i+d+deck.length)%deck.length;back=false;render()}
